services:
  ocr:
    build: .
    container_name: ocr-app
    restart: unless-stopped
    environment:
      OCR_RUNTIME_PROFILE: linux-low-vram
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
